# Reverse proxy for api-landing.dinamiceducation.com → Express API (Docker on 127.0.0.1:3001).
# TLS is added later with: sudo certbot --nginx -d api-landing.dinamiceducation.com

server {
    listen 80;
    listen [::]:80;
    server_name api-landing.dinamiceducation.com;

    # Contact form JSON payloads (64 KB server limit + margin).
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
